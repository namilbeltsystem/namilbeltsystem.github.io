  <!-- 문의 폼 -->
  <section class="section">
    <div class="container">
      <h2 class="section__title section__title--center">온라인 문의</h2>
      <p class="section__subtitle text-center">아래 양식을 작성해 주시면 빠른 시일 내에 답변 드리겠습니다.</p>

      <form class="inquiry-form" action="https://formspree.io/f/mojbdqzy" method="POST">
        <div class="inquiry-form__row">
          <div class="inquiry-form__group">
            <label class="inquiry-form__label" for="inquiry-name">이름<span class="required">*</span></label>
            <input class="inquiry-form__input" type="text" id="inquiry-name" name="name" data-validate required placeholder="홍길동">
            <span class="inquiry-form__error"></span>
          </div>
          <div class="inquiry-form__group">
            <label class="inquiry-form__label" for="inquiry-company">회사명</label>
            <input class="inquiry-form__input" type="text" id="inquiry-company" name="company" placeholder="(주)가나다">
          </div>
        </div>

        <div class="inquiry-form__row">
          <div class="inquiry-form__group">
            <label class="inquiry-form__label" for="inquiry-phone">연락처<span class="required">*</span></label>
            <input class="inquiry-form__input" type="tel" id="inquiry-phone" name="phone" data-validate required placeholder="010-1234-5678">
            <span class="inquiry-form__error"></span>
          </div>
          <div class="inquiry-form__group">
            <label class="inquiry-form__label" for="inquiry-email">이메일<span class="required">*</span></label>
            <input class="inquiry-form__input" type="email" id="inquiry-email" name="email" data-validate required placeholder="example@company.com">
            <span class="inquiry-form__error"></span>
          </div>
        </div>

        <div class="inquiry-form__group">
          <label class="inquiry-form__label" for="inquiry-type">문의 유형<span class="required">*</span></label>
          <select class="inquiry-form__select" id="inquiry-type" name="inquiry_type" data-validate required>
            <option value="">선택해 주세요</option>
            <option value="견적문의">견적 문의</option>
            <option value="기술상담">기술 상담 (벨트 선정, 사양)</option>
            <option value="현장방문">현장 방문 요청</option>
            <option value="유지보수">유지보수 / A/S</option>
            <option value="자료요청">카탈로그 / 기술자료 요청</option>
            <option value="기타">기타 문의</option>
          </select>
          <span class="inquiry-form__error"></span>
        </div>

        <div class="inquiry-form__group">
          <label class="inquiry-form__label" for="inquiry-message">문의 내용<span class="required">*</span></label>
          <textarea class="inquiry-form__textarea" id="inquiry-message" name="message" data-validate required placeholder="문의하실 내용을 자세히 적어주시면 보다 정확한 상담이 가능합니다.&#10;예) 사용 환경, 이송 물체, 현재 사용 중인 벨트 종류 등"></textarea>
          <span class="inquiry-form__error"></span>
        </div>

        <div class="inquiry-form__group">
          <label class="inquiry-form__check">
            <input type="checkbox" name="privacy_agree" value="yes" data-validate required>
            <span><a href="privacy.html" target="_blank">개인정보 처리방침</a>에 동의합니다. <span class="required">*</span></span>
          </label>
          <span class="inquiry-form__error"></span>
        </div>

        <button type="submit" class="inquiry-form__submit">문의하기</button>

        <div class="inquiry-form__success">
          <div class="inquiry-form__success-icon">&#9989;</div>
          <h3>문의가 접수되었습니다</h3>
          <p>빠른 시일 내에 답변 드리겠습니다.<br>긴급한 문의는 <strong>02-6084-7795</strong>로 전화 주세요.</p>
        </div>
      </form>
    </div>
